name: Build FM26 AI Manager V1.6
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Package portable
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force portable, portable\config, portable\data, portable\database, portable\logs, portable\backups | Out-Null
          $exe = Get-ChildItem build -Recurse -Filter FM26_AI_MANAGER.exe | Select-Object -First 1
          if (-not $exe) { throw 'FM26_AI_MANAGER.exe not generated' }
          Copy-Item $exe.FullName portable\FM26_AI_MANAGER.exe
          Copy-Item README_PORTABLE.txt portable\README_PORTABLE.txt
          Compress-Archive portable\* FM26_AI_MANAGER_V1.6_PORTABLE.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: FM26_AI_MANAGER_V1.6_PORTABLE
          path: FM26_AI_MANAGER_V1.6_PORTABLE.zip
