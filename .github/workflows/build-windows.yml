name: Build FM26 AI Manager V1.6.1

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release

      - name: Prepare source manifest
        shell: powershell
        run: |
          Get-FileHash FM26_AI_MANAGER.cpp -Algorithm SHA256 | Format-List | Out-File SOURCE_SHA256.txt
          Get-FileHash build\Release\FM26_AI_MANAGER.exe -Algorithm SHA256 | Format-List | Out-File BINARY_SHA256.txt

      - name: Package portable
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force portable, portable\config, portable\data, portable\database, portable\logs, portable\backups | Out-Null
          $exe = Get-ChildItem build -Recurse -Filter FM26_AI_MANAGER.exe | Select-Object -First 1
          if (-not $exe) { throw 'FM26_AI_MANAGER.exe not generated' }
          Copy-Item $exe.FullName portable\FM26_AI_MANAGER.exe
          Copy-Item README_PORTABLE.txt portable\README_PORTABLE.txt
          Copy-Item SOURCE_SHA256.txt portable\SOURCE_SHA256.txt
          Copy-Item BINARY_SHA256.txt portable\BINARY_SHA256.txt
          Compress-Archive portable\* FM26_AI_MANAGER_V1.6.1_PORTABLE.zip -Force

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: FM26_AI_MANAGER_V1.6.1_PORTABLE
          path: FM26_AI_MANAGER_V1.6.1_PORTABLE.zip
          if-no-files-found: error
